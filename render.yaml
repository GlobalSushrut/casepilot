# Public trial. One free web service runs CasePilot, Connector, and Surreal
# in the same container. Render's free plan has no disk and no private
# services, so this instance forgets cases when it sleeps or restarts.
# The model vendor key is still typed on the front page and is not set here.
# In-process tool admission is on because this node has no Firecracker guest.
# That is not the linux-kvm profile.

services:
  - type: web
    name: casepilot
    runtime: docker
    repo: https://github.com/GlobalSushrut/casepilot
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./deploy/trial.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: CASEPILOT_DB
        value: /tmp/casepilot/casepilot.db
      - key: CASEPILOT_SETUP
        value: /tmp/casepilot/setup.json
      - key: CONNECTOR_API_URL
        value: http://127.0.0.1:9091
      - key: CONNECTOR_API_KEY
        value: dev-token
      - key: CONNECTOR_HOST
        value: 127.0.0.1
      - key: CONNECTOR_PORT
        value: "9091"
      - key: CONNECTOR_DATA_DIR
        value: /tmp/connector
      - key: CONNECTOR_ENV
        value: development
      - key: CONNECTOR_DEV_MODE
        value: "1"
      - key: CONNECTOR_DEV_AGENT_CAP
        value: "64"
      - key: CONNECTOR_ALLOW_IN_PROCESS_EFFECTS
        value: "1"
      - key: SURREAL_URL
        value: http://127.0.0.1:8000
      - key: SURREAL_USER
        value: root
      - key: SURREAL_PASS
        value: root
